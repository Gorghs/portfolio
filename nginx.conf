server {
  listen 80;

  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Serve real files/directories only; unknown URLs return a true 404.
  location / {
    try_files $uri $uri/ =404;
  }

  # Content-hashed build assets never change; cache them long-term.
  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
  }

}
